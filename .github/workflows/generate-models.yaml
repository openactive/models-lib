name: Model Generation

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  generate:

    runs-on: ubuntu-latest

    strategy:
      matrix:
        language:
          - language: '.NET'
            repo: OpenActive.NET
          - language: 'PHP'
            repo: models-php
          - language: 'Ruby'
            repo: models-ruby
          - language: 'TypeScript'
            repo: models-ts

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        path: models-lib
    
    - name: Use Node.js 18.17.1
      uses: actions/setup-node@v1
      with:
        node-version: 18.17.1
  
    - run: npm install
      working-directory: models-lib
  
    - name: Update models-lib with latest data-models
      run: npm update @openactive/data-models
      working-directory: models-lib
  
    - name: Generate ${{ matrix.language }} models
      run: npm start -- generate ${{ matrix.language }} --destination ../output/
      working-directory: models-lib

    - name: Test model build
      uses: openactive/models-ts/.github/workflows/create-data-model-pr.yaml@ci/testable-build
      with:
        models-lib_ref: ${{ github.ref }}
